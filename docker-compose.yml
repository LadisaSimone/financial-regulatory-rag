services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      REGRAG__VECTOR_STORE__URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./experiments:/app/experiments
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_data:
