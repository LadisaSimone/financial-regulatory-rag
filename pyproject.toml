[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regrag"
version = "0.1.0"
description = "Financial Regulatory Intelligence RAG — grounded, cited answers over public AML/KYC/CDD regulatory documents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Simone Ladisa" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.9",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "tenacity>=8.2",
    "openai>=1.30",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=3.0",
]
anthropic = [
    "anthropic>=0.40",
]
tracking = [
    "mlflow>=2.12",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
regrag = "regrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",  # PyMuPDF SWIG bindings
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",   # in-memory Qdrant in tests
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["regrag"]
